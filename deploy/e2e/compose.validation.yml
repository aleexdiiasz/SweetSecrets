services:
  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    environment:
      MP_SMTP_TLS_CERT: /certs/server.crt
      MP_SMTP_TLS_KEY: /certs/server.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_DISABLE_RDNS: "true"
    volumes:
      - ${E2E_CERT_DIR:?E2E_CERT_DIR is required}/server.crt:/certs/server.crt:ro
      - ${E2E_CERT_DIR:?E2E_CERT_DIR is required}/server.key:/certs/server.key:ro
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-18025}:8025"
    networks:
      - backend

  api:
    depends_on:
      mailpit:
        condition: service_started

  web:
    volumes:
      - ./e2e/nginx.validation.conf:/etc/nginx/nginx.conf:ro
      - ${E2E_CERT_DIR:?E2E_CERT_DIR is required}/ca.crl:/usr/share/nginx/html/ten033-ca.crl:ro
